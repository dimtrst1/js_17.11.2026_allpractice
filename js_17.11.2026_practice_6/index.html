<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sover(n) {
        let sum = 0;

        for (let i = 1; i < n; i++) {
            if (n % i == 0) {
                sum += i;
            }
        }

        return sum == n;
        }

        function diap(min, max) {
            for (let i = min; i <= max; i++) {
                if (sover(i)) {
                    alert(i);
                }
            }
        }

        diap(1, 1000);
    </script>
</body>
</html>
