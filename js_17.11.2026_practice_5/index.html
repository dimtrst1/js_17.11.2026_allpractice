<!DOCTYPE html>

<body>
    <script>
        function sover(n) {
        let sum = 0;

        for (let i = 1; i < n; i++) {
            if (n % i == 0) {
                sum += i;
            }
        }

        return sum == n;
        }

        alert(sover(6));
    </script>
</body>
